name: Verify VibeCheck

on:
  push:
    branches: [main, codex/vibecheck-evidence-workspace]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      REPORT_SIGNING_SECRET: vibecheck-ci-fixture-only-never-for-deployment
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: node scripts/evaluate-verifier.mjs
      - run: npx playwright install --with-deps chrome
      - run: npx playwright test tests/browser/workspace.spec.ts --workers=1
